/* spec: {tpl,c,pat,pc,belly,fin}  pat 0없음 1줄무늬 2점 3띠 4등 5얼룩 6머리 7가는줄 */
function buildFish(spec,seed){
  if(spec.art)return buildArt(spec.art);
  const rows=FISH_TPL[spec.tpl]||FISH_TPL.round;
  const w0=Math.max.apply(null,rows.map(r=>r.length)),h0=rows.length,P=2,W=w0+P*2,H=h0+P*2;
  const g=[];for(let y=0;y<H;y++)g.push(new Array(W).fill('.'));
  rows.forEach((r,y)=>{for(let x=0;x<r.length;x++)g[y+P][x+P]=r[x]});
  const body=hex(spec.c),belly=spec.belly?hex(spec.belly):lighten(body,.5),back=darken(body,.14);
  const fin=spec.fin?hex(spec.fin):lighten(hueShift(body,14),.2);
  const pc=spec.pc?hex(spec.pc):(spec.pat===5?hueShift(darken(body,.25),-20):darken(hueShift(body,-12),.32));
  let minX=99,maxX=0,minY=99,maxY=0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(g[y][x]==='b'){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}
  const mid=(minY+maxY)>>1,bw=maxX-minX;
  const out=Buf(W,H);
  const isB=(x,y)=>y>=0&&y<H&&x>=0&&x<W&&(g[y][x]==='b'||g[y][x]==='e');
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const ch=g[y][x];if(ch==='.')continue;
    if(ch==='b'){
      let c=body;
      if(!isB(x,y+1)||!isB(x,y+2))c=belly;
      else if(!isB(x,y-1))c=back;
      const rx=x-minX;
      switch(spec.pat|0){
        case 1:if(rx>3&&rx<bw-3&&rx%4<2&&c!==belly)c=mixc(c,pc,.6);break;
        case 2:if(H2(x,y,seed)<.1&&c!==belly)c=pc;break;
        case 3:if(y===mid&&rx>bw*.25&&rx<bw*.82)c=pc;break;
        case 4:if(y<=minY+1)c=pc;break;
        case 5:if(H2(Math.floor(rx/4),Math.floor((y-minY)/4),seed)<.42)c=pc;break;
        case 6:if(rx>bw*.64&&c!==belly)c=pc;break;
        case 7:if((y===mid-1||y===mid+1)&&rx>bw*.2&&rx<bw*.85)c=pc;break;
      }
      px(out,x,y,c);
    }else if(ch==='f')px(out,x,y,(x+y)%2?fin:lighten(fin,.22));
    else if(ch==='e')px(out,x,y,[52,42,70]);
    else if(ch==='d')px(out,x,y,darken(body,.55));
  }
  outlineBuf(out,mixc(darken(body,.6),OUT,.55));
  return out;
}

function buildArt(a){
  const rows=a.rows,w0=Math.max.apply(null,rows.map(r=>r.length)),h0=rows.length,P=2,b=Buf(w0+P*2,h0+P*2);
  rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const c=a.pal[r[x]];if(c)px(b,x+P,y+P,hex(c))}});
  outlineBuf(b,mixc(darken(hex(a.pal[1]),.5),OUT,.5));
  return b;
}

function buildPlayer(look){

      if(dir==='down'){fillR(b,6,12,4,1,shirtD)}
      fillR(b,5,16,6,2,pants);
      fillR(b,5,18-lift,2,2,pants);fillR(b,9,18-lift2,2,2,pants);
      fillR(b,5,20-lift,2,1,boot);fillR(b,9,20-lift2,2,1,boot);

      fillR(b,6,16,5,2,pants);

    const b2=Buf(16,22);b2.d.set(b.d,16*4);

function petSprite(pet,map,frame){

  rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const ch=r[x];if(ch==='.')continue;let c=pet.pal[ch]||pet.pal.b;let col=hex(c);
    if(pet.stripes&&(ch==='b'||ch==='h'||ch==='t')&&(x+frame)%3===0&&y>0)col=hex(pet.stripes);
    if(pet.spots&&(ch==='b'||ch==='h')&&H2(x,y,7)<.2)col=hex(pet.spots);
    px(b,x,y,col)}});
  // 깜콩이: 부엉이처럼 크고 동그란 눈 (노란 테두리 + 까만 눈동자 + 반짝)
  if(pet.owl){for(let y=0;y<b.h;y++)for(let x=0;x<b.w;x++){if(rows[y]&&rows[y][x]==='e'){px(b,x,y,[24,20,28]);px(b,x-1,y,hex('#ffd23c'));px(b,x+1,y,hex('#ffd23c'));px(b,x,y-1,hex('#ffd23c'));px(b,x,y+1,hex('#ffd23c'));px(b,x+1,y-1,[255,255,255])}}}

}

   +0 → +20. 강화권 1장으로 돌려요.
   안전 강화: 강화권 + 골드. 실패할수록 '장인의 손맛'이 쌓여 100%가 되면 다음 안전 강화는 무조건 성공. 파괴 없음

const ENH={
  MAX:20,
  P:[.9,.75,.6,.5,.4,.32,.25,.2,.15,.12,.08,.06,.05,.04,.03,.025,.02,.015,.01,.005],
  cost:L=>Math.round(20*Math.pow(1.4,L)/10)*10||10,

function enhSlices(L,mode){
  const p=ENH.P[L]||0,s=[];
  if(mode==='safe'){
    s.push({k:'up',p:p});const f=1-p;
    if(L>=10){s.push({k:'keep',p:f*.6},{k:'down',p:f*.4})}else if(L>=5){s.push({k:'keep',p:f*.7},{k:'down',p:f*.3})}else s.push({k:'keep',p:f});
  }else{
    s.push({k:'jack',p:p*.105},{k:'up',p:p*.595});const f=1-p*.7;
    if(L>=10)s.push({k:'keep',p:f*.5},{k:'down',p:f*.3},{k:'break',p:f*.2});
    else if(L>=5)s.push({k:'keep',p:f*.67},{k:'down',p:f*.25},{k:'break',p:f*.08});
    else s.push({k:'keep',p:f});
  }
  return s;
}

/* ---------- 오디오: 코드로 만든 BGM + 효과음 (WebAudio) ---------- */
const Snd=(()=>{
  let ctx=null,master,bgmBus,sfxBus,rev,revSend,delay,delayFB;
  const vol={bgm:.6,sfx:.8,mute:false};
  let cur=null,timer=null,intense=false;
  const tracks={};
  const mtof=m=>440*Math.pow(2,(m-69)/12);

  function init(){
    if(ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ctx=new AC();
    master=ctx.createGain();master.gain.value=vol.mute?0:1;master.connect(ctx.destination);
    bgmBus=ctx.createGain();sfxBus=ctx.createGain();
    bgmBus.gain.value=vol.bgm*.55;sfxBus.gain.value=vol.sfx*.9;
    // 잔향
    rev=ctx.createConvolver();
    const len=ctx.sampleRate*2.8,buf=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
    rev.buffer=buf;
    revSend=ctx.createGain();revSend.gain.value=.55;
    const revOut=ctx.createGain();revOut.gain.value=.7;
    revSend.connect(rev);rev.connect(revOut);revOut.connect(master);
    // 부드러운 에코
    delay=ctx.createDelay(2);delay.delayTime.value=.46;delayFB=ctx.createGain();delayFB.gain.value=.32;
    const dl=ctx.createBiquadFilter();dl.type='lowpass';dl.frequency.value=2400;
    delay.connect(dl);dl.connect(delayFB);delayFB.connect(delay);dl.connect(revSend);
    bgmBus.connect(master);bgmBus.connect(revSend);
    sfxBus.connect(master);
    const sfxRev=ctx.createGain();sfxRev.gain.value=.25;sfxBus.connect(sfxRev);sfxRev.connect(revSend);
    timer=setInterval(tick,90);
  }
  function resume(){if(ctx&&ctx.state!=='running')ctx.resume()}
  function setVol(k,v){vol[k]=v;if(!ctx)return;if(k==='bgm')bgmBus.gain.setTargetAtTime(v*.55,ctx.currentTime,.05);if(k==='sfx')sfxBus.gain.setTargetAtTime(v*.9,ctx.currentTime,.05)}
  function setMute(m){vol.mute=m;if(ctx)master.gain.setTargetAtTime(m?0:1,ctx.currentTime,.05)}

  /* ----- 악기 ----- */
  function env(g,t,a,d,peak,end){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(Math.max(.0001,end||.0001),t+a+d)}
  function bell(out,f,t,dur,v){ // 오르골
    const g=ctx.createGain();env(g,t,.004,dur,v);
    const o1=ctx.createOscillator(),o2=ctx.createOscillator(),g2=ctx.createGain();
    o1.type='sine';o1.frequency.value=f;o2.type='sine';o2.frequency.value=f*2.76;g2.gain.value=.16;
    o1.connect(g);o2.connect(g2);g2.connect(g);g.connect(out);
    o1.start(t);o2.start(t);o1.stop(t+dur+.1);o2.stop(t+dur*.5);
  }
  function pluck(out,f,t,dur,v){ // 부드러운 피아노풍
    const g=ctx.createGain();env(g,t,.01,dur,v);
    const o=ctx.createOscillator(),o2=ctx.createOscillator(),lp=ctx.createBiquadFilter();
    o.type='triangle';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;
    lp.type='lowpass';lp.frequency.setValueAtTime(2600,t);lp.frequency.exponentialRampToValueAtTime(500,t+dur);
    const g2=ctx.createGain();g2.gain.value=.25;
    o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(out);
    o.start(t);o2.start(t);o.stop(t+dur+.1);o2.stop(t+dur+.1);
  }
  function flute(out,f,t,dur,v){ // 숨결 같은 선율
    const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.09);g.gain.setValueAtTime(v,t+Math.max(.1,dur-.18));g.gain.linearRampToValueAtTime(0,t+dur);
    const o=ctx.createOscillator(),lfo=ctx.createOscillator(),lg=ctx.createGain();
    o.type='sine';o.frequency.value=f;lfo.frequency.value=5;lg.gain.value=f*.004;lfo.connect(lg);lg.connect(o.frequency);
    const o2=ctx.createOscillator(),g2=ctx.createGain();o2.type='triangle';o2.frequency.value=f;g2.gain.value=.18;o2.connect(g2);g2.connect(g);
    o.connect(g);g.connect(out);o.start(t);o2.start(t);lfo.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05);lfo.stop(t+dur+.05);
  }
  function pad(out,notes,t,dur,v){
    notes.forEach(m=>{
      [-4,4].forEach(det=>{
        const o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();
        o.type='triangle';o.frequency.value=mtof(m);o.detune.value=det;
        lp.type='lowpass';lp.frequency.value=900;
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v/notes.length,t+dur*.35);g.gain.linearRampToValueAtTime(0,t+dur+.6);
        o.connect(lp);lp.connect(g);g.connect(out);o.start(t);o.stop(t+dur+.7);
      });
    });
  }
  function bass(out,m,t,dur,v){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=mtof(m);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+.05);
  }
  let noiseBuf=null;
  function noise(){if(noiseBuf)return noiseBuf;const b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return noiseBuf=b}
  function nz(out,t,dur,type,f0,f1,v,q){
    const s=ctx.createBufferSource();s.buffer=noise();const f=ctx.createBiquadFilter();f.type=type;f.Q.value=q||1;
    f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+Math.min(.02,dur/3));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(out);s.start(t,Math.random());s.stop(t+dur+.05);
  }

  /* ----- BGM 트랙 ----- */
  // 마을: 76bpm, 8분음표 64스텝(8마디), 따뜻한 C 장조
  const TOWN_CH=[[48,60,64,67,71],[45,57,60,64,67],[41,57,60,64,69],[43,59,62,64,67],[45,57,60,64,67],[50,57,60,65,69],[43,59,62,64,67],[48,60,64,67,71]];
  const TOWN_ARP=[0,2,3,4,3,2,4,3];
  const townMelByBar=[
    [[0,76,3],[3,79,1],[4,81,3],[7,79,1]],[[0,76,2],[2,74,2],[4,72,3],[7,74,1]],
    [[0,76,2],[2,77,1],[3,81,2],[5,79,3]],[[0,74,3],[3,76,1],[4,79,3]],
    [[0,84,3],[3,83,1],[4,81,3],[7,79,1]],[[0,81,2],[2,77,2],[4,81,3],[7,84,1]],
    [[0,83,3],[3,81,1],[4,79,2],[6,76,2]],[[0,76,6]]];
  tracks.town={bpm:76,steps:64,gain:null,
    step(i,t,loop,out,sd){
      const bar=i>>3,s=i&7,ch=TOWN_CH[bar];
      if(s===0){pad(out,ch.slice(1,4),t,sd*8,.05);bass(out,ch[0],t,sd*5,.13)}
      pluck(out,mtof(ch[1+TOWN_ARP[s]%4]+ (TOWN_ARP[s]>=4?12:0)),t,sd*3.5,.045);
      townMelByBar[bar].forEach(n=>{if(n[0]===s){const f=mtof(n[1]);if(loop%2===0)bell(out,f,t,sd*n[2]*1.6,.07);else flute(out,f,t,sd*n[2]*.95,.045)}});
    }};
  // 낚시: 58bpm, D 리디안 느낌, 4마디 × 2 = 64스텝
  const FISH_CH=[[38,57,61,64,69],[47,54,57,62,66],[43,59,62,66,69],[45,57,61,64,69],[38,57,61,64,69],[40,56,59,64,68],[43,59,62,66,69],[45,57,61,64,67]];
  const FISH_MEL=[[0,81,6],[10,78,4],[16,76,6],[24,74,5],[32,73,5],[40,76,4],[44,78,6],[52,81,8],[60,78,4]];
  tracks.fish={bpm:58,steps:64,gain:null,
    step(i,t,loop,out,sd){
      const bar=i>>3,s=i&7,ch=FISH_CH[bar];
      if(s===0){pad(out,ch.slice(1,5),t,sd*8,.06);bass(out,ch[0],t,sd*7,.12)}
      if(s===4&&bar%2===1)bell(out,mtof(ch[3]+12),t,sd*5,.04);
      FISH_MEL.forEach(n=>{if(n[0]===i)bell(out,mtof(n[1]),t,sd*n[2]*1.5,.06)});
      if(i%16===3)nz(out,t,2.2,'lowpass',500,260,.012,.5); // 물 소리
      if(intense&&(s%2===0)){const a=[0,2,3,4,3,2,4,3][s%8];pluck(out,mtof(ch[1+a%4]+12),t,sd*1.6,.035)}
    }};
  tracks.night={bpm:60,steps:64,gain:null, // 밤의 마을: 한 옥타브 낮고 느리게 (town 코드 재사용)
    step(i,t,loop,out,sd){
      const bar=i>>3,s=i&7,ch=TOWN_CH[bar];
      if(s===0){pad(out,ch.slice(1,4),t,sd*8,.055);bass(out,ch[0],t,sd*6,.12)}
      if(s===0||s===4)bell(out,mtof(ch[3]+12),t,sd*4,.05);
      townMelByBar[bar].forEach(n=>{if(n[0]===s&&(n[0]%4===0))bell(out,mtof(n[1]),t,sd*n[2]*1.8,.04)});
    }};

  let nextT=0,stepI=0,loopN=0;
  function setTrack(name){
    if(!ctx||cur===name)return;
    const old=cur?tracks[cur]:null;
    if(old&&old.gain)old.gain.gain.setTargetAtTime(0,ctx.currentTime,.5);
    cur=name;const tr=tracks[name];
    if(!tr.gain){tr.gain=ctx.createGain();tr.gain.gain.value=0;tr.gain.connect(bgmBus)}
    tr.gain.gain.cancelScheduledValues(ctx.currentTime);
    tr.gain.gain.setValueAtTime(tr.gain.gain.value,ctx.currentTime);
    tr.gain.gain.linearRampToValueAtTime(1,ctx.currentTime+1.8);
    stepI=0;loopN=0;nextT=ctx.currentTime+.25;
  }
  function tick(){
    if(!ctx||!cur||ctx.state!=='running')return;
    const tr=tracks[cur],sd=60/tr.bpm/2;
    while(nextT<ctx.currentTime+.5){
      tr.step(stepI,nextT,loopN,tr.gain,sd);
      nextT+=sd;stepI++;if(stepI>=tr.steps){stepI=0;loopN++}
    }
  }
  function setIntense(v){intense=v}

  /* ----- 효과음 ----- */
  const S={
    step(){const t=ctx.currentTime;nz(sfxBus,t,.06,'bandpass',900+Math.random()*500,500,.05,1.2)},
    ui(){const t=ctx.currentTime;bell(sfxBus,880,t,.18,.1);bell(sfxBus,1320,t+.05,.2,.07)},
    tap(){const t=ctx.currentTime;bell(sfxBus,1046,t,.12,.08)},
    back(){const t=ctx.currentTime;bell(sfxBus,784,t,.14,.08)},
    cast(){const t=ctx.currentTime;nz(sfxBus,t,.38,'bandpass',300,2200,.12,1.5);S.splash(.42)},
    splash(d){const t=ctx.currentTime+(d||0);nz(sfxBus,t,.35,'lowpass',1800,300,.2,.7);
      const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(620,t);o.frequency.exponentialRampToValueAtTime(190,t+.18);
      g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+.25)},
    bite(){const t=ctx.currentTime;bell(sfxBus,1318,t,.4,.16);bell(sfxBus,1976,t+.11,.5,.14);nz(sfxBus,t,.2,'lowpass',900,300,.1,1)},
    hook(){const t=ctx.currentTime;bell(sfxBus,988,t,.2,.12);bell(sfxBus,1480,t+.06,.3,.1);S.splash()},
    reel(p){const t=ctx.currentTime;nz(sfxBus,t,.05,'highpass',1800+p*2200,3000+p*2200,.05,2)},
    miss(){const t=ctx.currentTime;bell(sfxBus,392,t,.3,.1);bell(sfxBus,294,t+.12,.5,.1)},
    escape(){const t=ctx.currentTime;[392,330,262].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*.13);g.gain.linearRampToValueAtTime(.12,t+i*.13+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.13+.35);o.connect(g);g.connect(sfxBus);o.start(t+i*.13);o.stop(t+i*.13+.4)})},
    catch(r){const t=ctx.currentTime;const sc=[72,76,79,84,88,91];const n=r>=3?6:r>=2?5:4;
      for(let i=0;i<n;i++)bell(sfxBus,mtof(sc[i]),t+i*.09,.9,.13);
      if(r>=3){pad(sfxBus,[60,67,72,76],t,1.8,.14);for(let i=0;i<6;i++)bell(sfxBus,mtof(96+(i%3)*2),t+.6+i*.07,.8,.05)}
      if(r>=4){for(let i=0;i<10;i++)bell(sfxBus,mtof(84+[0,4,7,12,16][i%5]),t+.9+i*.08,1.1,.06)}},
    coin(){const t=ctx.currentTime;bell(sfxBus,1976,t,.14,.1);bell(sfxBus,2637,t+.07,.4,.1)},
    buy(){const t=ctx.currentTime;S.coin();bell(sfxBus,784,t+.18,.5,.1);bell(sfxBus,1046,t+.26,.6,.1);bell(sfxBus,1318,t+.34,.8,.1)},
    no(){const t=ctx.currentTime;[180,150].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.12,t+i*.1);g.gain.exponentialRampToValueAtTime(.0001,t+i*.1+.15);o.connect(g);g.connect(sfxBus);o.start(t+i*.1);o.stop(t+i*.1+.2)})},
    gate(){const t=ctx.currentTime;nz(sfxBus,t,.8,'lowpass',500,150,.16,.8);pad(sfxBus,[60,64,67,71],t+.1,1.4,.16);S.buy()},
    page(){const t=ctx.currentTime;[72,76,79,84,88,91,96].forEach((m,i)=>bell(sfxBus,mtof(m),t+i*.1,1.2,.12))}
  };
  function sfx(n,a){if(!ctx||vol.mute)return;try{S[n](a)}catch(e){}}
  return{init,resume,setTrack,setIntense,sfx,setVol,setMute,vol,get ready(){return!!ctx}};
})();

/* ---------- 월드: 타일맵 · 낚시터 · 문 ---------- */
const TS=16,MW=34,MH=60;
function genWorld(){
  const T=[],Z=[],SOL=[],MASK=[];
  for(let y=0;y<MH;y++){T.push(new Array(MW).fill('g'));Z.push(new Array(MW).fill(0));SOL.push(new Array(MW).fill(false));MASK.push(new Array(MW).fill(0))}
  const inb=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH;
  const rnd=RNG(7);
  /* 바다와 모래사장 */
  const shoreY=x=>39+Math.round(Math.sin(x*.55)*1+Math.sin(x*.21)*.8);
  for(let y=32;y<MH;y++)for(let x=0;x<MW;x++){
    if(y<shoreY(x))T[y][x]='s';else{T[y][x]='w';Z[y][x]=y<49?3:4}
  }
  /* 부두 (2칸 폭) */
  for(let y=36;y<MH-1;y++)for(const x of[16,17]){T[y][x]='k';Z[y][x]=0}
  /* 달빛 호수 */
  for(let y=0;y<15;y++)for(let x=0;x<MW;x++){const dx=(x+.5-17)/11,dy=(y+.5-6)/3.7;if(dx*dx+dy*dy<=1){T[y][x]='w';Z[y][x]=5}}
  /* 연못 */
  for(let y=16;y<31;y++)for(let x=0;x<MW;x++){const dx=(x+.5-6)/5.3,dy=(y+.5-24.5)/3.8;if(dx*dx+dy*dy<=1){T[y][x]='w';Z[y][x]=1}}
  /* 시냇물 */
  for(let y=16;y<31;y++){const xl=31-(Math.sin(y*.7)>.4?1:0);for(let x=xl;x<MW;x++){T[y][x]='w';Z[y][x]=2}}
  /* 길 */
  const path=(x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(inb(x,y)&&T[y][x]!=='w'&&T[y][x]!=='k')T[y][x]='p'};
  path(17,10,17,35);path(12,22,28,22);path(28,22,30,22);path(16,21,18,23);path(22,20,22,22);path(12,20,12,22);path(15,36,18,38);path(13,29,16,29);path(18,29,21,29);path(22,29,25,29);
  /* 울타리와 문 */
  const fences=[],gates=[];
  for(let x=0;x<MW;x++){fences.push({x:x,y:15,k:'h'});fences.push({x:x,y:31,k:'h'})}
  for(let y=16;y<31;y++)fences.push({x:27,y:y,k:'v'});
  const GATE_AT={5:[[17,15]],3:[[17,31]],2:[[27,22]],4:[[16,49],[17,49]]};
  Object.keys(GATE_AT).forEach(z=>GATE_AT[z].forEach(p=>gates.push({zone:+z,x:p[0],y:p[1],k:(+z===2?'v':'h')})));
  fences.forEach(f=>{if(gates.some(g=>g.x===f.x&&g.y===f.y))return;if(T[f.y][f.x]==='w')return;SOL[f.y][f.x]=true});
  fences.splice(0,fences.length,...fences.filter(f=>!gates.some(g=>g.x===f.x&&g.y===f.y)&&T[f.y][f.x]!=='w'));
  gates.forEach(g=>{T[g.y][g.x]=g.zone===4?'k':'p'});
  /* 건물 */
  const buildings=[
    {id:'shop',x:21,y:19,w:3,h:3,door:[22,20],opts:{wall:[252,240,222],roof:[160,214,196],roofD:[124,184,168],door:[214,166,150],kind:'shop'}},
    {id:'lib',x:11,y:19,w:3,h:3,door:[12,20],opts:{wall:[246,238,252],roof:[196,176,236],roofD:[158,140,206],door:[190,160,200],kind:'lib'}},
    {id:'boutique',x:20,y:28,w:3,h:3,door:[21,29],opts:{wall:[255,246,250],roof:[244,186,214],roofD:[220,150,186],door:[200,160,210],kind:'boutique'}},
    {id:'trade',x:12,y:28,w:3,h:3,door:[13,29],opts:{wall:[252,246,232],roof:[246,196,140],roofD:[220,164,110],door:[176,140,110],kind:'trade'}},
    {id:'forge',x:24,y:27,w:3,h:3,door:[25,28],opts:{wall:[255,244,230],roof:[236,150,120],roofD:[206,116,92],door:[150,116,100],kind:'forge'}}
  ];
  buildings.forEach(b=>{for(let y=b.y-b.h+1;y<=b.y;y++)for(let x=b.x;x<b.x+b.w;x++)SOL[y][x]=true});
  /* 소품 */
  const props=[];
  const prop=(kind,x,y,solid)=>{props.push({kind:kind,x:x,y:y});if(solid!==false)SOL[y][x]=true};
  [[15,21],[19,21],[16,34],[18,34],[17,13]].forEach(p=>prop('lamp',p[0],p[1]));
  [[14,24],[20,24],[14,35],[20,35]].forEach(p=>prop('bench',p[0],p[1]));
  prop('litter',15,27); // 고양이 화장실
  [[24,20],[24,19],[10,20]].forEach(p=>prop('barrel',p[0],p[1]));
  [[13,23],[26,23]].forEach(p=>prop('sign',p[0],p[1]));
  /* 바다 쪽 소품 */
  [[3,36],[28,37],[8,37],[24,34]].forEach(p=>{if(T[p[1]][p[0]]==='s')prop('rock',p[0],p[1])});
  /* 물가 마스크 (육지와 맞닿은 면) */
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(T[y][x]==='w'){SOL[y][x]=true;let m=0;
      if(inb(x,y-1)&&T[y-1][x]!=='w')m|=1;if(inb(x+1,y)&&T[y][x+1]!=='w')m|=2;if(inb(x,y+1)&&T[y+1][x]!=='w')m|=4;if(inb(x-1,y)&&T[y][x-1]!=='w')m|=8;MASK[y][x]=m}
  }
  /* 장식: 꽃 · 갈대 · 연잎 */
  const deco=[],occ=new Set();props.forEach(p=>occ.add(p.x+','+p.y));
  buildings.forEach(b=>{for(let y=b.y-b.h+1;y<=b.y+1;y++)for(let x=b.x-1;x<b.x+b.w+1;x++)occ.add(x+','+y)});
  const nearWater=(x,y)=>[[1,0],[-1,0],[0,1],[0,-1]].some(d=>inb(x+d[0],y+d[1])&&T[y+d[1]][x+d[0]]==='w');
  const flowerCols=[[[255,176,200],[255,232,150],[206,196,255]],[[255,206,160],[255,255,255],[190,226,255]]];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(T[y][x]==='g'&&!SOL[y][x]&&!occ.has(x+','+y)){
      if(nearWater(x,y)&&rnd()<.45){deco.push({k:'reed',x:x,y:y,v:(rnd()*4)|0})}
      else if(rnd()<.09)deco.push({k:'flower',x:x,y:y,v:(rnd()*6)|0,c:rnd()<.5?0:1});
    }
    if(T[y][x]==='w'&&(Z[y][x]===1||Z[y][x]===5)&&MASK[y][x]===0&&rnd()<.14)deco.push({k:'lily',x:x,y:y,v:(rnd()*5)|0});
  }
  /* 나무 */
  const trees=[],okTree=(x,y)=>{
    if(!inb(x,y)||T[y][x]!=='g'||SOL[y][x]||occ.has(x+','+y))return false;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if(inb(X,Y)&&(T[Y][X]==='p'||T[Y][X]==='w'||T[Y][X]==='k'||SOL[Y][X]&&!trees.some(t=>t.x===X&&t.y===Y)&&false))return false}
    if(trees.some(t=>Math.abs(t.x-x)<2&&Math.abs(t.y-y)<2))return false;
    return true};
  for(let i=0;i<900;i++){
    const x=(rnd()*MW)|0,y=(rnd()*MH)|0;

  }

  return{T:T,Z:Z,SOL:SOL,MASK:MASK,fences:fences,gates:gates,buildings:buildings,props:props,deco:deco,trees:trees,doors:doors,inb:inb,
    spawn:{x:17*TS+8,y:23*TS+12}};
}

/* 낚시 방식
   손맛(기본): 모든 물고기가 줄다리기. 단, 도감 보너스까지 잡아 '익숙해진' 흔함 · 보통은 바로 올라와요 (성장)
   느긋하게(설정): 흔함 · 보통은 늘 바로, 줄다리기도 쉽게. 대신 희귀 이상이 덜 나와요 */
const easyMode=()=>S.set.mode==='easy';
const REEL={
  hard:[{p:50,s:1.1,d:.8,g:1.1,l:.9},{p:42,s:1,d:.9,g:.95,l:1},{p:34,s:1,d:1,g:.8,l:1.2},{p:28,s:.92,d:1.05,g:.68,l:1.45},{p:26,s:.88,d:1.05,g:.62,l:1.6}],
  easy:[null,null,{p:45,s:1.15,d:.85,g:1,l:1},{p:34,s:1,d:1,g:.78,l:1.3},{p:28,s:.92,d:1.05,g:.66,l:1.55}]
};
function hook(){
  const f=F.fish;
  if(!easyMode()&&f.rar<=1&&mastered(f.id)){F.mode='pull';F.t=0;F.from=bobberPos();F.familiar=true;Snd.sfx('hook');Snd.sfx('splash');return}
  F.familiar=false;
  // 흔함 · 보통은 줄다리기 없이 바로 낚아요. 희귀 이상만 짧은 줄다리기
  if(easyMode()&&f.rar<=1){F.mode='pull';F.t=0;F.from=bobberPos();Snd.sfx('hook');Snd.sfx('splash');return}
  F.mode='reel';F.t=0;Snd.sfx('hook');Snd.setIntense(true);
  const R=REEL[easyMode()?'easy':'hard'][f.rar];
  F.reel={bp:0,bv:0,fp:50,ft:50,ftT:0,prog:R.p,size:ST.bar*R.s,d:Math.min(1,f.diff*R.d),g:R.g,l:R.l,tick:0,time:0};
  showReel(true);
}
function stepReel(dt){
  const r=F.reel,d=r.d;r.time+=dt;
  const up=inp.hold;
  r.bv+=(up?400:-340)*dt;r.bv=Math.max(-115,Math.min(115,r.bv));
  r.bp+=r.bv*dt;
  if(r.bp<0){r.bp=0;r.bv=Math.max(0,r.bv*-.2)}
  if(r.bp>100-r.size){r.bp=100-r.size;r.bv=-Math.abs(r.bv)*.25}
  r.ftT-=dt;
  if(r.ftT<=0){r.ftT=.45+Math.random()*.9-d*.25;const rng=26+d*58;r.ft=Math.max(6,Math.min(94,r.fp+(Math.random()*2-1)*rng))}
  const sp=32+d*78;r.fp+=Math.max(-sp*dt,Math.min(sp*dt,r.ft-r.fp));
  const inBar=r.fp>=r.bp-2&&r.fp<=r.bp+r.size+2;
  r.prog+=inBar?(36*r.g*ST.reel*(1-d*.25))*dt:-(10+d*10)*r.l*dt;
  r.prog=Math.min(100,r.prog);
  r.tick-=dt;if(inBar&&r.tick<=0){r.tick=.16;Snd.sfx('reel',r.prog/100)}
  if(r.prog>=100){F.mode='pull';F.t=0;F.from=bobberPos();showReel(false);Snd.setIntense(false);Snd.sfx('splash')}
  else if(r.prog<=0){F.mode='idle';showReel(false);Snd.setIntense(false);Snd.sfx('escape');toast(F.fish.rar>=3&&(S.gear.rod<5||S.gear.reel<5)?'앗, 놓쳤어요… 낚싯대 · 릴을 강화하면 큰 물고기도 버텨요':'앗, 놓쳤어요…');inp.hold=false}
  updateReelUI(inBar);
}
function finishCatch(){
  const f=F.fish,id=f.id;
  F.len=Math.max(1,Math.round(f.len*(.7+Math.random()*.6)));
  const had=!!S.dex[id],wasT=tierOf(id);const wasDone=[];for(let p=0;p<PAGES;p++)wasDone[p]=pageDone(p);
  S.inv[id]=(S.inv[id]||0)+1;
  const e=S.dex[id]||(S.dex[id]={n:0,best:0});e.n++;e.best=Math.max(e.best,F.len);
  S.stats.catches++;F.isNew=!had;F.pageUp=-1;F.masterUp=tierOf(id)>wasT?tierOf(id):0;
  for(let p=0;p<PAGES;p++)if(!wasDone[p]&&pageDone(p))F.pageUp=p;

  recalc();F.t=0;

  if(f.rar>=3&&navigator.vibrate)try{navigator.vibrate([40,40,80])}catch(e){}
  if(F.isNew||f.rar>=2||F.pageUp>=0||F.masterUp||F.gift){F.mode='result';showResult()}
  else{F.mode='idle';
    if(f.rar<=1&&Math.random()<gearEff.bob2(S.gear.bob)){S.inv[id]++;e.n++;S.stats.catches++;F.double=true;enhOnCatch(id,1);recalc()}else F.double=false;
    quickCatch(f)}
  saveState();
}
/* 걸어두기: 켜 두기만 해도 3분마다 흔함 · 보통이 걸려요 (하루 30마리). 희귀 이상은 직접 낚아야 해요 */
const AFK_SEC=180,AFK_CAP=30;

}
function stopAfk(msg){if(!F.afk)return;F.afk=false;if(F.mode==='wait'||F.mode==='cast')F.mode='idle';if(msg)toast(msg)}

  S.inv[id]=(S.inv[id]||0)+1;const e=S.dex[id]||(S.dex[id]={n:0,best:0});const isNew=!e.n;e.n++;e.best=Math.max(e.best,F.len);S.stats.catches++;
  enhOnCatch(id,1);const g=grantRewards();recalc();saveState();
  F.isNew=false;F.double=false;F.familiar=false;quickCatch(f);if(isNew)setTimeout(()=>toast('새 물고기! '+f.name+' (걸어두기)'),1500);

}
const floats=[];

/* 마당 친구들 상태. 루비는 나를 따라오고, 고양이들은 마당(마을 안)을 돌아다녀요 */
const pets=PETS.map((p,i)=>({p:p,x:(16+i*2)*TS,y:(25+(i%2))*TS,tx:0,ty:0,state:'idle',t:Math.random()*3,anim:0,face:1,love:0,heartT:0}));
const YARD={x0:11,x1:26,y0:20,y1:30};
function petWalkable(x,y){return!blockedAt(x,y)&&x>YARD.x0*TS&&x<(YARD.x1+1)*TS&&y>YARD.y0*TS&&y<(YARD.y1+1)*TS}
function updatePets(dt){
  pets.forEach(a=>{
    const p=a.p;a.t-=dt;a.heartT-=dt;
    if(p.follow){ // 루비: 나를 따라와요
      const dx=P.x-a.x,dy=P.y-a.y,d=Math.hypot(dx,dy);
      if(d>200){a.x=P.x-14;a.y=P.y+2}
      if(d>34){const s=Math.min(d-30,(d>80?70:p.speed+20)*dt);a.x+=dx/d*s;a.y+=dy/d*s;a.state='walk';a.anim+=dt;a.face=dx<0?-1:1}
      else{if(a.state==='walk'){a.state='sit';a.t=8+Math.random()*8}if(a.t<0)a.state=a.state==='sit'?'sleep':'sit',a.t=10+Math.random()*10}
      return;
    }
    // 내가 벤치에 앉아 있으면 가까운 고양이들이 옆으로 와요
    if(P.sit&&a.state!=='walk'&&Math.hypot(P.x-a.x,P.y-a.y)<120&&Math.hypot(P.x-a.x,P.y-a.y)>26&&Math.random()<dt*.3){
      const ang=Math.random()*6.28;a.tx=P.x+Math.cos(ang)*18;a.ty=P.y+8+Math.sin(ang)*6;if(petWalkable(a.tx,a.ty)){a.state='walk';a.t=8}}
    if(a.state==='walk'){
      const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy),s=p.speed*dt;a.anim+=dt;a.face=dx<0?-1:1;
      if(d<1.5||a.t<0){a.state=Math.random()<p.sleepy?'sleep':'sit';a.t=(a.state==='sleep'?14:5)+Math.random()*10}
      else{const nx=a.x+dx/d*s,ny=a.y+dy/d*s;if(petWalkable(nx,ny)){a.x=nx;a.y=ny}else a.t=-1}
    }else if(a.t<0){

/* ===== 낚싯대 강화소 =====
   온라인: 서버가 강화권 · 확률 · 결과를 모두 정해요 (조작 불가, 랭킹 공정).  혼자 모드: 같은 규칙을 이 기기에서 */
const enhLocal={cd:{},idleMs:0};
function enhDaily(e,out){const d=kstDay();if(e.day===d)return;e.day=d;e.ft=0;e.it=0;e.idle=0;e.pcd=0;e.tk=Math.min(ENH.TK_MAX,e.tk+ENH.DAILY);if(out)out.push('오늘의 출석 강화권 '+ENH.DAILY+'장!')}
function enhAddPoints(e,pts,out){
  if(e.ft>=ENH.FISH_CAP){e.fp=0;return}
  e.fp+=pts;while(e.fp>=ENH.FISH_PER&&e.ft<ENH.FISH_CAP){e.fp-=ENH.FISH_PER;e.ft++;e.tk=Math.min(ENH.TK_MAX,e.tk+1);if(out)out.push('낚시 강화권 +1 (오늘 '+e.ft+'/'+ENH.FISH_CAP+')')}
  if(e.ft>=ENH.FISH_CAP)e.fp=0;
}
function enhAddPiece(e,n,out){
  n=Math.min(n,ENH.PIECE_CAP-e.pcd);if(n<=0){if(out)out.push('오늘 모을 수 있는 반짝 조각은 다 모았어요');return 0}
  e.pcd+=n;e.pc+=n;if(out)out.push('반짝 조각 +'+n);
  while(e.pc>=ENH.PIECE_PER){e.pc-=ENH.PIECE_PER;e.tk=Math.min(ENH.TK_MAX,e.tk+1);if(out)out.push('조각 '+ENH.PIECE_PER+'개로 강화권 +1!')}
  return n;
}
function enhRoll(e,mode,gold){
  const L=e.lv;if(L>=ENH.MAX)return{err:'이미 최고 단계예요'};
  if(e.tk<1)return{err:'강화권이 없어요'};
  const cost=mode==='safe'?ENH.cost(L):0;if(gold<cost)return{err:'골드가 모자라요 ('+fmt(cost)+'골드)'};
  e.tk--;
  let k;
  if(mode==='safe'&&e.pity>=100)k='up';
  else{const sl=enhSlices(L,mode);let r=Math.random();k=sl[sl.length-1].k;for(const x of sl){if(r<x.p){k=x.k;break}r-=x.p}}
  const from=L;
  if(k==='up'){e.lv++;if(mode==='safe')e.pity=0}
  else if(k==='jack')e.lv=Math.min(ENH.MAX,L+2);
  else{if(mode==='safe')e.pity=Math.min(100,e.pity+ENH.P[L]*50);if(k==='down')e.lv=Math.max(0,L-1);if(k==='break')e.lv=0}
  e.max=Math.max(e.max,e.lv);
  return{k:k,from:from,to:e.lv,cost:cost,mode:mode};
}
/* 다리: 혼자면 바로 계산, 온라인이면 서버에 부탁 */
function enhOnCatch(id,n){if(ONLINE)return;const out=[];enhDaily(S.enh,out);enhAddPoints(S.enh,ENH.PTS[FISH[id].rar]*n,out);if(out.length)enhNote(out)}
function enhLocalIdle(dt){if(ONLINE||document.hidden||!$('title').hidden)return;const e=S.enh;enhDaily(e);if(e.it>=ENH.IDLE_CAP)return;
  e.idle+=dt*1000;if(e.idle>=ENH.IDLE_MIN*60000){e.idle=0;e.it++;e.tk=Math.min(ENH.TK_MAX,e.tk+1);enhNote(['켜 둔 보상! 강화권 +1 (오늘 '+e.it+'/'+ENH.IDLE_CAP+')']);saveState()}}
const LIFE_RULE={spark:{cd:100,ch:1,n:1},tree:{cd:1800,ch:.5,n:1,per:true},pet:{cd:600,ch:.4,n:1,per:true},litter:{cd:7000,ch:1,n:2},sit:{cd:840,ch:1,n:1}};
/* 생활 보상: 반짝 조각이 그 자리에 톡 떨어지고, 걸어가서 주워야 가방에 들어가요 */
const dropSrc={};
function lifeEvent(src,id,x,y){
  if(x===undefined){x=P.x;y=P.y}
  const sid=id!==undefined?String(id):'';
  if(ONLINE){if(Net.me){dropSrc[src+':'+sid]=[x,y];Net.send({t:'life',src:src,id:sid})}return}
  const r=LIFE_RULE[src];if(!r)return;const key=src+(r.per?':'+id:''),now=Date.now();
  if(enhLocal.cd[key]&&now-enhLocal.cd[key]<r.cd*1000)return;enhLocal.cd[key]=now;
  const out=[];enhDaily(S.enh,out);if(out.length)enhNote(out);
  if(Math.random()<r.ch){const n=Math.min(r.n,ENH.PIECE_CAP-S.enh.pcd-dropPending());
    if(n>0)spawnDrop(x,y,n,0);else toast('오늘 모을 수 있는 반짝 조각은 다 모았어요')}
  saveState();
}
const drops=[];
const dropPending=()=>drops.reduce((a,d)=>a+(d.state==='gone'?0:d.n),0);
function spawnDrop(x,y,n,did){
  let tx=x,ty=y+8;
  for(let k=0;k<16;k++){const ang=Math.random()*6.28,d=12+Math.random()*10,ax=x+Math.cos(ang)*d,ay=y+6+Math.abs(Math.sin(ang))*8;if(!blockedAt(ax,ay)){tx=ax;ty=ay;break}}
  if(blockedAt(tx,ty)){tx=P.x+(Math.random()<.5?-14:14);ty=P.y+4}
  drops.push({x:x,y:y,sx:x,sy:y,tx:tx,ty:ty,t:0,n:n,did:did,state:'fly'});Snd.sfx('tap');
}
function updateDrops(dt){
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.t+=dt;
    if(d.state==='fly'){const k=Math.min(1,d.t/.55);d.x=d.sx+(d.tx-d.sx)*k;d.y=d.sy+(d.ty-d.sy)*k;d.z=Math.sin(k*Math.PI)*16;if(k>=1){d.state='rest';d.t=0;d.z=0;sparkFx(d.x,d.y-2,4,['#fff6b0','#e8d4ff'])}}
    else if(d.state==='rest'){if(Math.hypot(d.x-P.x,d.y-P.y)<14){d.state='pick';d.t=0;d.sx=d.x;d.sy=d.y}else if(d.t>300){drops.splice(i,1)}}
    else if(d.state==='pick'){const k=Math.min(1,d.t/.22);d.x=d.sx+(P.x-d.sx)*k;d.y=d.sy+(P.y-6-d.sy)*k;d.z=k*8;if(k>=1){drops.splice(i,1);pickDrop(d)}}
  }
}
function pickDrop(d){
  Snd.sfx('coin');sparkFx(P.x,P.y-16,10,['#fff6b0','#ffffff','#d6b8ff']);floats.push({x:P.x,y:P.y-26,t:0,img:SP.crystal});
  if(ONLINE){Net.send({t:'pick',did:d.did});return}
  const out=[];enhDaily(S.enh,out);enhAddPiece(S.enh,d.n,out);if(out.length)enhNote(out);saveState();
}
function drawDrop(d){
  const s=SP.crystal,bob=d.state==='rest'?Math.round(Math.sin(wt*3+d.x)*1):0,a=d.state==='rest'&&d.t>270?(300-d.t)/30:1;
  cx.fillStyle='rgba(60,50,100,.18)';cx.beginPath();cx.ellipse(Math.round(d.x),Math.round(d.y),3,1.2,0,0,6.28);cx.fill();
  cx.globalAlpha=Math.max(0,a);cx.drawImage(s,Math.round(d.x-s.width/2),Math.round(d.y-s.height-1-(d.z||0)+bob));
  if(d.state==='rest'&&((wt*3+d.x)|0)%4===0){cx.fillStyle='#ffffff';cx.fillRect(Math.round(d.x+2),Math.round(d.y-s.height-2+bob),1,1)}
  cx.globalAlpha=1;
}

function drawWheel(){
  const c=$('wheel');if(!c)return;const x=c.getContext('2d'),R=110,cxw=115,cyw=115;x.clearRect(0,0,230,230);
  let a0=wheel.ang-Math.PI/2;
  wheel.slices.forEach(s=>{const a1=a0+s.p*Math.PI*2;x.beginPath();x.moveTo(cxw,cyw);x.arc(cxw,cyw,R,a0,a1);x.closePath();x.fillStyle=SLICE_COL[s.k];x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.stroke();
    if(s.p>.045){const am=(a0+a1)/2;x.save();x.translate(cxw+Math.cos(am)*R*.62,cyw+Math.sin(am)*R*.62);x.rotate(am+Math.PI/2);x.fillStyle=s.k==='break'?'#fff':'#4a3d6b';x.font='13px '+getComputedStyle(document.body).fontFamily;x.textAlign='center';x.fillText(ENH_NAME[s.k].split(' ')[0],0,4);x.restore()}
    a0=a1});
  x.beginPath();x.arc(cxw,cyw,20,0,6.28);x.fillStyle='#fffaf2';x.fill();x.strokeStyle='#e2d6f0';x.lineWidth=3;x.stroke();
}
function spinWheel(){
  if(wheel.spin)return;const e=S.enh;
  wheel.spin=true;wheel.v=14+Math.random()*4;wheel.res=null;wheel.slices=enhSlices(e.lv,forgeMode);Snd.sfx('cast');
  const b=body().querySelector('[data-fg=spin]');if(b){b.disabled=true;b.textContent='돌아가는 중…'}
  if(ONLINE){Net.flushSave(true);Net.send({t:'enh_try',mode:forgeMode});setTimeout(()=>{if(wheel.spin&&!wheel.res){wheel.spin=false;toast('서버가 대답하지 않아요');if(forgeOpen())renderForge()}},6000)}
  else{const r=enhRoll(S.enh,forgeMode,S.gold);if(r.err){wheel.spin=false;toast(r.err);renderForge();return}S.gold-=r.cost;setTimeout(()=>wheelLand(r),300);saveState()}
  let last=performance.now();
  (function tick(now){if(!wheel.spin)return;const dt=Math.min(.05,(now-last)/1000);last=now;
    if(wheel.res){ // 멈출 각도로 부드럽게
      const d=wheel.target-wheel.ang;if(d<.002){wheel.ang=wheel.target;drawWheel();wheel.spin=false;wheelDone();return}
      wheel.ang+=Math.max(.004,d*3*dt);
    }else wheel.ang+=wheel.v*dt;
    if(((wheel.ang*5)|0)!==wheel.tk){wheel.tk=(wheel.ang*5)|0;Snd.sfx('reel',.3)}
    drawWheel();requestAnimationFrame(tick)})(last);
}
function wheelLand(r){
  wheel.res=r;
  // 돌림판의 결과 칸 안 아무 곳에 멈추도록 목표 각도 정하기 (포인터는 위쪽)
  const sl=wheel.slices||enhSlices(r.from,r.mode);let a=0,seg=null;for(const s of sl){if(s.k===r.k){seg=[a,a+s.p];break}a+=s.p}
  if(!seg)seg=[0,sl[0].p];const pick=(seg[0]+(seg[1]-seg[0])*(.2+Math.random()*.6))*Math.PI*2;
  let tgt=-pick;while(tgt<wheel.ang+Math.PI*4)tgt+=Math.PI*2;wheel.target=tgt;
}

(function(){
  const st=$('stick'),kn=$('knob');let id=null;
  const R=44;
  function move(e){const r=st.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),k=d>R?R/d:1;
    kn.style.transform='translate('+dx*k+'px,'+dy*k+'px)';inp.x=dx*k/R;inp.y=dy*k/R}
  st.addEventListener('pointerdown',e=>{if(id!==null)return;id=e.pointerId;st.setPointerCapture(id);move(e);Snd.resume()});
  st.addEventListener('pointermove',e=>{if(e.pointerId===id)move(e)});
  const end=e=>{if(e.pointerId!==id)return;id=null;inp.x=inp.y=0;kn.style.transform=''};
  st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
  const a=$('act');
  a.addEventListener('pointerdown',e=>{e.preventDefault();a.setPointerCapture(e.pointerId);pressAct()});
  const up=()=>releaseAct();a.addEventListener('pointerup',up);a.addEventListener('pointercancel',up);a.addEventListener('lostpointercapture',up);
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('visibilitychange',()=>{if(document.hidden){saveState(true);inp.hold=false}});
  addEventListener('pagehide',()=>saveState(true));
})();

function onTradeClick(t){
  const a=t.dataset.tr,v=t.dataset.v,d=TR.draft;Snd.sfx('tap');
  if(a==='tab'){TR.tab=v;TR.view='list';TR.pick=null;if(v==='board')loadBoard();renderTrade();return true}
  if(a==='write'){TR.draft={kind:'give',give:-1,gn:1,want:-1,wn:1,note:''};TR.view='write';renderTrade();return true}
  if(a==='back'){TR.view='list';renderTrade();return true}
  if(a==='kind'){d.kind=v;renderTrade();return true}
  if(a==='pick'){TR.pick={from:v==='give'?'bag':'all',key:v};renderTrade();return true}
  if(a==='unpick'){TR.pick=null;renderTrade();return true}
  if(a==='pk'){const pk=TR.pick,id=+v;TR.pick=null;
    if(pk.key==='dadd'){const s=TR.ses;if(s){s.mine[id]=Math.min(S.inv[id]||0,(s.mine[id]||0)+1);sendOffer()}return true}
    if(pk.key==='give'){d.give=id;d.gn=1}else{d.want=id;d.wn=1}renderTrade();return true}
  if(a==='cnt'){const p=v.split(':'),k=p[0],dn=+p[1];if(k==='give')d.gn=Math.max(1,Math.min(S.inv[d.give]||1,99,d.gn+dn));else d.wn=Math.max(1,Math.min(99,d.wn+dn));renderTrade();return true}
  if(a==='clr'){if(v==='give')d.give=-1;else d.want=-1;renderTrade();return true}
  if(a==='post'){
    if(d.give>=0&&(S.inv[d.give]||0)<d.gn){toast('가방에 그만큼 없어요');return true}
    t.disabled=true;Net.flushSave(true);
    Net.send({t:'bd_post',kind:d.kind,give:d.give>=0?[d.give,d.gn]:null,want:d.want>=0?[d.want,d.wn]:null,note:cleanText(d.note).slice(0,20)});
    TR.view='list';TR.posts=null;renderTrade();return true}
  if(a==='take'){t.disabled=true;Net.flushSave(true);Net.send({t:'bd_take',id:v});return true}
  if(a==='del'){t.disabled=true;Net.send({t:'bd_del',id:v});return true}
  if(a==='req'){askTrade(v);return true}
  if(a==='dadd'){TR.pick={from:'bag',key:'dadd',minus:i=>TR.ses?TR.ses.mine[i]||0:0};renderTrade();return true}
  if(a==='dcnt'){const s=TR.ses;if(!s)return true;const p=v.split(':'),id=+p[0],n=(s.mine[id]||0)+(+p[1]);if(n<=0)delete s.mine[id];else s.mine[id]=Math.min(n,S.inv[id]||0);sendOffer();return true}
  if(a==='dok'){const s=TR.ses;if(!s)return true;Net.flushSave(true);Net.send({t:'tr_ok',ok:!s.okMe});return true}
  if(a==='dquit'){closeSheet();return true}
  return false;
}

function applyDelta(d,rev,why){

  Object.keys(d||{}).forEach(k=>{const id=+k,n=d[k]|0;if(!FISH[id]||!n)return;S.inv[id]=Math.max(0,(S.inv[id]||0)+n);

  const g=grantRewards();recalc();saveState(true);
  if(why)toast(why+(got.length?' · 받은 물고기: '+got.join(', '):''));
  if(g.length)setTimeout(()=>toast('도감 보상: '+g.join(', ')),2400);
}
const Net={ws:null,me:null,state:'off',creds:null,retry:0,kicked:false,waking:false,lastPos:'',posT:0,hbT:0,saveT:0,saveQ:false,onLogin:null,
  connect(){
    if(this.kicked)return;
    this.state='connecting';this.waking=false;netBanner();
    const wakeT=setTimeout(()=>{if(this.state==='connecting'){this.waking=true;netBanner()}},2500);
    let ws;try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws')}catch(e){clearTimeout(wakeT);this.later();return}
    this.ws=ws;
    ws.onopen=()=>{clearTimeout(wakeT);this.waking=false;this.retry=0;this.state='open';netBanner();
      if(this.creds)this.send({t:'login',name:this.creds.name,code:this.creds.code})};
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}this.onMsg(m)};
    ws.onclose=()=>{clearTimeout(wakeT);if(this.ws!==ws)return;this.ws=null;
      others.forEach(o=>{o.tag.remove();if(o.bub)o.bub.remove()});others.clear();

  posKey:'',

  const old=others.get(m.id);if(old)old.tag.remove();
  const tag=document.createElement('div');tag.className='ntag';tag.hidden=true;$('tags').appendChild(tag);tag.addEventListener('pointerdown',e=>{e.stopPropagation();if(!uiOpen){const o=others.get(m.id);if(o)openProfile(o)}});
  const o={id:m.id,name:m.name,color:m.color|0,look:cleanLook(m.look,m.color),x:m.x||0,y:m.y||0,tx:m.x||0,ty:m.y||0,d:m.d||'down',m:0,b:0,anim:0,seen:!!m.here,tag:tag,bub:null,say:null,emo:null};
  setTag(o,o.name,o.look.ti,o.look.e);others.set(m.id,o);if(tradeOpen())renderTrade();
}
function drawOthers(dt,list){
  const k=1-Math.exp(-dt*12);
  others.forEach(o=>{
    if(!o.seen)return;
    const gap=Math.hypot(o.tx-o.x,o.ty-o.y);
    if(gap>64){o.x=o.tx;o.y=o.ty}else{o.x+=(o.tx-o.x)*k;o.y+=(o.ty-o.y)*k}
    const mv=o.m||gap>.6;if(mv)o.anim+=dt;
    const spr=lookSprites(o.look)[o.d][mv?[0,1,0,2][((o.anim*8)|0)%4]:0];
    list.push({y:o.y,fn:()=>{cx.fillStyle='rgba(60,50,100,.16)';cx.beginPath();cx.ellipse(Math.round(o.x),Math.round(o.y)-1,6,2.5,0,0,6.28);cx.fill();
      cx.drawImage(spr,Math.round(o.x-8),Math.round(o.y-21));
      // 친구가 낚시 중이면 그 친구의 낚싯대 · 찌 스킨으로
      if(o.b>0&&!mv){const bx=((o.b-1)%MW)*TS+8,by=Math.floor((o.b-1)/MW)*TS+8,off={right:[13,-21],left:[-13,-21],up:[6,-25],down:[9,-11]}[o.d]||[9,-11],tip=[o.x+off[0],o.y+off[1]];
        drawRod(o.x+({right:4,left:-4,up:3,down:3}[o.d]||3),o.y-12,tip[0],tip[1],o.look.rod);const dy=Math.sin(wt*3+String(o.id).length)*.8;lineBetween(tip,[bx,by+dy],5);drawBob(bobCan(o.look.bob),bx,by+dy)}}});
  });
}
function placeTags(cX,cY){
  lastCX=cX;lastCY=cY;
  const ox=(innerWidth-VW*SC)/2,oy=(innerHeight-VH*SC)/2,now=performance.now();
  const put=(a,x,y)=>{
    const sx=ox+(Math.round(x)-cX)*SC,sy=oy+(Math.round(y)-23-cY)*SC,vis=sx>-90&&sx<innerWidth+90&&sy>-60&&sy<innerHeight+60;
    let top=sy;
    if(a.tag){const on=vis&&a.tagOn;if(a.tag.hidden===on)a.tag.hidden=!on;
      if(on){a.tag.style.transform='translate('+Math.round(sx)+'px,'+Math.round(sy)+'px) translate(-50%,-100%)';if(!a.tagH)a.tagH=a.tag.offsetHeight;top=sy-a.tagH-2}}
    if(a.say&&now>a.say.until){a.say=null;if(a.bub){a.bub.remove();a.bub=null}}
    if(a.bub){a.bub.hidden=!vis;if(vis)a.bub.style.transform='translate('+Math.round(sx)+'px,'+Math.round(top-8)+'px) translate(-50%,-100%)'}
  };
  if(P)put(ME,P.x,P.y);
  pets.forEach(a=>{if(!a.tag){a.tag=document.createElement('div');a.tag.className='ptag';a.tag.textContent=a.p.name;$('tags').appendChild(a.tag)}
    const near=Math.hypot(a.x-P.x,a.y-P.y)<44,sx=ox+(Math.round(a.x)-cX)*SC,sy=oy+(Math.round(a.y)-15-cY)*SC;
    if(a.tag.hidden===near)a.tag.hidden=!near;if(near)a.tag.style.transform='translate('+Math.round(sx)+'px,'+Math.round(sy)+'px) translate(-50%,-100%)'});
  others.forEach(o=>{if(!o.seen){o.tag.hidden=true;if(o.bub)o.bub.hidden=true;return}put(o,o.x,o.y)});
}
function loginMsg(t,bad){const el=$('tMsg');el.textContent=t;el.style.color=bad?'#d9607e':'';if(bad)$('tStart').disabled=false}
function doLogin(){
  if($('tStart').disabled)return;
  Snd.init();Snd.resume();
  const n=$('tName').value.trim(),c=$('tCode').value.trim();
  if(n.length<2||n.length>10)return loginMsg('닉네임은 2~10글자로 해 주세요.',true);
  if(!/^\d{4,8}$/.test(c))return loginMsg('코드는 숫자 4~8자리예요.',true);
  $('tStart').disabled=true;loginMsg(Net.state==='open'?'마을로 가는 중…':'서버에 연결하는 중… 잠시만요');
  Net.login(n,c);
}
function onLoggedIn(m){
  S=m.save?fromSave(m.save):defaultState();
  if(!m.save||!m.save.cos)S.cos.look.s=(m.color|0)%SHIRTS.length; // 처음엔 서버가 정해 준 옷 색
  grantRewards();refreshMe();
  recalc();newPlayer();lastGold=-1;
  $('tStart').disabled=false;startGame();
  toast(m.isNew?m.name+' 님, 물결마을에 온 걸 환영해요!':m.name+' 님, 어서 와요!');
  saveState(true);
}

/* ----- 타이틀 · 시작 ----- */
function startGame(){
  Snd.init();Snd.resume();Snd.setVol('bgm',S.set.bgm);Snd.setVol('sfx',S.set.sfx);Snd.setMute(S.set.mute);
  $('title').hidden=true;Snd.sfx('ui');
  $('hint').hidden=!!S.hinted;
  if(!S.trap)S.trap=Date.now(); // 통발은 처음부터 놓여 있어요
  refreshMe();updateTrapDot();
  if(trapCount())setTimeout(()=>toast('통발에 물고기 '+trapCount()+'마리가 모였어요! 메뉴에서 걷어 올려요'),1200);
  if(!ONLINE){const out=[];enhDaily(S.enh,out);if(out.length)setTimeout(()=>toast(out[0]+' 메뉴 → 낚싯대 강화소에서 돌려 보세요'),3800)}
}
/* ----- 스테이터스 창: 나 · 다른 친구 (인기도 · 동물 친구 호감도 · 기록) ----- */
const PF={id:null,data:null};
function petRows(p){return PETS.map(pt=>{const a=Math.max(0,Math.min(100,(p&&p[pt.id]&&p[pt.id].a)|0)),t=COS.find(c=>c.pet===pt.id);
  return'<div class="pet-row"><span class="n">'+esc(pt.name)+'</span><div class="bar"><i style="width:'+a+'%"></i><s></s></div><span class="v">'+a+'/100</span></div>'}).join('')+
  '<div class="muted" style="font-size:11px;margin-bottom:10px">보라 선(60)을 넘으면 그 친구의 칭호를 받아요. 쓰다듬기 +4 · 화장실 청소 고양이들 +3</div>'}
function profileHtml(d,mine){
  const t=COS_BY[d.ti],pop=d.pop||{n:0,up:0,dn:0};
  let h='<div class="pf-top">'+(t?'<div class="ti">「'+esc(t.name)+'」</div>':'')+'<div class="nm">'+esc(d.name||'나')+(d.e>0?' <span style="color:#e07a2c">+'+d.e+'</span>':'')+'</div>'+
    '<div class="pop">'+(mine||!ONLINE?'':'<button class="btn ghost sm" data-pop="-1" aria-label="인기도 내리기">▼ 내리기</button>')+'<div><div class="muted" style="font-size:11px">인기도</div><b>♥'+(pop.n|0)+'</b></div>'+(mine||!ONLINE?'':'<button class="btn pink sm" data-pop="1" aria-label="인기도 올리기">▲ 올리기</button>')+'</div>'+
    '<div class="muted" style="font-size:11px">받은 ▲'+(pop.up|0)+' · ▼'+(pop.dn|0)+(mine?'':' · 한 사람에게 하루 한 번')+'</div></div>';
  h+='<div class="sec">동물 친구 호감도</div>'+petRows(d.pets);
  h+='<div class="sec">기록</div><div class="srcs"><div>잡은 물고기 <b>'+fmt(d.catches|0)+'</b></div><div>도감 <b>'+(d.dex|0)+'종</b></div><div>최고 강화 <b>+'+(d.max|0)+'</b></div><div>지금 강화 <b>+'+(d.e|0)+'</b></div></div>';
  if(mine)h+='<div class="muted" style="font-size:12px">다른 친구나 이름표를 누르면 그 친구의 정보를 볼 수 있어요.</div>';
  return h;
}
function myProfile(){return{name:ONLINE&&Net.me?Net.me.name:'나',ti:S.cos.look.ti,e:S.enh.lv,max:S.enh.max,pop:S.pop,pets:S.pets,catches:S.stats.catches,dex:Object.keys(S.dex).filter(k=>S.dex[k].n>0).length}}
function openProfile(o){
  if(F.mode!=='idle')return;Snd.sfx('ui');
  if(!o){PF.id=null;openSheet('내 정보',profileHtml(myProfile(),true),()=>{PF.id=null});return}
  PF.id=o.id;PF.data=null;openSheet(o.name+' 님','<div class="muted" style="padding:24px;text-align:center">불러오는 중…</div>',()=>{PF.id=null});
  Net.send({t:'prof',id:o.id});
}
function onProf(m){if(PF.id!==m.id||$('sheetwrap').hidden)return;PF.data=m;body().innerHTML=profileHtml(m,false)}
/* 캔버스를 누르면: 친구 → 스테이터스, 나 → 내 정보, 동물 → 호감도 */
let lastCX=0,lastCY=0;
$('cv').addEventListener('pointerdown',e=>{
  if(uiOpen||F.mode!=='idle'||!$('title').hidden)return;
  const ox=(innerWidth-VW*SC)/2,oy=(innerHeight-VH*SC)/2,wx=(e.clientX-ox)/SC+lastCX,wy=(e.clientY-oy)/SC+lastCY;
  const hit=(x,y)=>Math.abs(wx-x)<10&&wy>y-26&&wy<y+3;
  let best=null;others.forEach(o=>{if(o.seen&&hit(o.x,o.y))best=o});
  if(best){openProfile(best);return}
  const pt=pets.find(a=>Math.abs(wx-a.x)<10&&wy>a.y-16&&wy<a.y+3);
  if(pt){const v=(S.pets[pt.p.id]&&S.pets[pt.p.id].a)|0;toast(pt.p.name+' · 호감도 '+v+'/100'+(v<60?' (60이면 칭호)':''));return}
  if(P&&hit(P.x,P.y))openProfile(null);
});
/* ----- 3단계: 말하기 창 (정해진 문구 · 자유 입력 · 감정표현) ----- */
const PHRASES=['안녕!','반가워요','고마워요!','같이 낚시해요','대박!','잠깐만요','교환할래요?','또 봐요!'];
function setupTalk(){
  $('emos').innerHTML=EMOTES.map(e=>'<button data-emo="'+e.k+'" aria-label="'+e.name+'"><img src="'+SP.emo[e.k][0].toDataURL()+'" alt="">'+e.name+'</button>').join('');
  $('phr').innerHTML=PHRASES.map(p=>'<button data-say="'+esc(p)+'">'+esc(p)+'</button>').join('');
  const open=v=>{$('talk').hidden=!v;$('bTalk').setAttribute('aria-expanded',v?'true':'false')};
  $('bTalk').addEventListener('pointerdown',e=>{e.stopPropagation()});
  $('bTalk').onclick=()=>{if(!$('title').hidden)return;open($('talk').hidden);Snd.sfx('tap')};
  $('talk').addEventListener('pointerdown',e=>e.stopPropagation());
  document.addEventListener('pointerdown',()=>{if(!$('talk').hidden&&document.activeElement!==$('talkin'))open(false)});
  $('talk').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.emo){emote(b.dataset.emo);open(false)}else if(b.dataset.say){say(b.dataset.say);open(false)}});
  $('talkf').onsubmit=e=>{e.preventDefault();const v=$('talkin').value;if(cleanText(v)){say(v);$('talkin').value='';$('talkin').blur();open(false)}};
  ME.tag=document.createElement('div');ME.tag.className='ntag';ME.tag.hidden=true;$('tags').appendChild(ME.tag);ME.tag.addEventListener('pointerdown',e=>{e.stopPropagation();if(!uiOpen)openProfile(null)});
}
(function boot(){
  grantRewards();recalc();buildSprites();resize();newPlayer();initAmbient();setupTalk();
  const ids=[0,8,19];$('tfish').innerHTML=ids.map(i=>'<img src="'+fishURL(i+0)+'" alt="">').join('');
  const has=hasSave()&&(S.stats.casts>0||S.gold!==60);
  if(ONLINE){
    $('tLogin').hidden=false;$('tStart').textContent='마을로 가기';
    try{const c=JSON.parse(localStorage.getItem(LOGIN_KEY)||'null');if(c){$('tName').value=c.name;$('tCode').value=c.code}}catch(e){}
    $('tStart').onclick=doLogin;Net.onLogin=onLoggedIn;Net.connect();
  }else{
    $('tStart').textContent=has?'이어하기':'시작하기';$('tNew').hidden=!has;
    $('tStart').onclick=startGame;
    $('tNew').onclick=()=>{try{localStorage.removeItem(SAVE_KEY)}catch(e){}S=defaultState();recalc();newPlayer();startGame()};
  }
  requestAnimationFrame(frame);
})();

</script>
